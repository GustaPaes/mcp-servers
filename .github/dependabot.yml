version: 2
updates:
  - package-ecosystem: npm
    directory: /tfs-mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /career-development-mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /playwright-mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # A tipagem major deve acompanhar a matriz de runtime suportada.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /oci-mcp/oci-extras-mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # A versao 5 exige migracao explicita de imports e semantica YAML.
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /meta-ads-mcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # Majors exigem uma migracao coordenada de runtime e toolchain.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: undici
        update-types: [version-update:semver-major]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /meta-ads-mcp/web-panel
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # A tipagem major deve acompanhar a matriz de runtime suportada.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ["*"]
