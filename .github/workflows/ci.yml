name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-mcps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tfs-mcp
            dir: tfs-mcp
            command: npm test
          - name: career-development-mcp
            dir: career-development-mcp
            command: npm test
          - name: playwright-mcp
            dir: playwright-mcp
            command: npm run build
          - name: oci-extras-mcp
            dir: oci-mcp/oci-extras-mcp
            command: npm test
          - name: meta-ads-mcp
            dir: meta-ads-mcp
            command: npm test && npm run typecheck && npm run build
          - name: meta-ads-mcp-web-panel
            dir: meta-ads-mcp/web-panel
            command: npm run typecheck && npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Validate ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.command }}
